<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f8f6f0"/><g font-family="Calibri,Arial,sans-serif" fill="#234d40"><text x="64" y="62" font-size="20" font-weight="700">SCENARIO ANALYSIS</text><text x="64" y="143" font-size="46" font-weight="700">From gross savings to net benefit</text><text x="64" y="202" font-size="27" fill="#59675f">Illustrative inputs • Editable assumptions</text></g><g><rect x="64" y="275" width="345" height="130" rx="8" fill="#234d40"/><rect x="467" y="275" width="345" height="130" rx="8" fill="#a04c36"/><rect x="870" y="275" width="345" height="130" rx="8" fill="#234d40"/></g><g fill="white" font-family="Calibri,Arial,sans-serif" font-size="30"><text x="90" y="329">Avoided commissions</text><text x="90" y="373">and advertising</text><text x="495" y="329">Incremental fees,</text><text x="495" y="373">discounts and delivery</text><text x="900" y="351">Net modeled benefit</text></g><g fill="#234d40" font-family="Arial" font-size="40"><text x="428" y="353">−</text><text x="831" y="353">=</text></g><g fill="#202b28" font-family="Calibri,Arial,sans-serif" font-size="28"><text x="64" y="497">Marketplace share → Direct ordering → Contribution impact</text><text x="64" y="574" fill="#59675f">Compare 0%, 5%, 10% and 15% sales-shift scenarios.</text></g><text x="64" y="680" font-family="Calibri,Arial,sans-serif" font-size="20" fill="#59675f">Fictional financial inputs. Savings are estimates, not achieved results.</text></svg>